<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>Puente de Mando · La Fábrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
  :root {
    color-scheme: dark;
    --casco: #05080f;
    --panel: #0a1322;
    --panel-2: #0f1c30;
    --linea: #1b3656;
    --cian: #29e7ff;
    --cian-suave: #7fb8d6;
    --texto: #d6ecff;
    --ambar: #ffb020;
    --verde: #39ff88;
    --rojo: #ff4d4d;
    --ovni: #39ff88;
    --poli: #ff4d4d;
    --historia: #ffd60a;
    --archivo: #e0a95e;
    --ketone: #6fc3ff;
    --hud: "Orbitron", "Rajdhani", system-ui, sans-serif;
    --leer: "Rajdhani", system-ui, -apple-system, "Segoe UI", sans-serif;
    --reloj: "Share Tech Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -200px, #0d2440 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(41,231,255,0.035) 0 1px, transparent 1px 4px),
      var(--casco);
    color: var(--texto); font: 500 16px/1.4 var(--leer);
    padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 16px; }
  /* Cabina */
  .cabina { display: grid; gap: 10px; border: 1px solid var(--linea); background: linear-gradient(180deg, rgba(15,28,48,0.9), rgba(10,19,34,0.9)); border-radius: 14px; padding: 14px 16px; position: relative; }
  .cabina::before, .cabina::after { content: ""; position: absolute; width: 18px; height: 18px; border: 2px solid var(--cian); }
  .cabina::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  .cabina::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font: 800 clamp(18px, 4.6vw, 26px)/1.1 var(--hud); letter-spacing: 0.06em; margin: 0; text-transform: uppercase; }
  h1 span { color: var(--cian); }
  .reloj-tx { font-family: var(--reloj); color: var(--cian); font-size: 15px; letter-spacing: 0.05em; }
  .lecturas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .lectura { background: var(--casco); border: 1px solid var(--linea); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; }
  .lectura b { font: 400 clamp(20px, 6vw, 30px)/1 var(--reloj); color: var(--cian); font-variant-numeric: tabular-nums; }
  .lectura span { font-size: 12px; color: var(--cian-suave); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
  .lectura.ambar b { color: var(--ambar); } .lectura.verde b { color: var(--verde); }
  @media (max-width: 480px) { .lecturas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* Siguiente lanzamiento */
  .lanzamiento { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; border: 1px solid var(--ambar); border-radius: 12px; padding: 10px 14px; background: rgba(255,176,32,0.07); }
  .lanzamiento .cuenta { font: 400 clamp(26px, 8vw, 40px)/1 var(--reloj); color: var(--ambar); font-variant-numeric: tabular-nums; }
  .lanzamiento .lbl { font: 700 12px var(--leer); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ambar); }
  .lanzamiento .que { font-weight: 700; font-size: 17px; }
  h2 { font: 800 14px var(--hud); letter-spacing: 0.14em; text-transform: uppercase; color: var(--cian); margin: 6px 0 0; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--linea), transparent); }
  .sub { color: var(--cian-suave); margin: 0; font-size: 15px; }
  main { display: grid; gap: 12px; }
  /* Tarjetas de video */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
  .card { position: relative; background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 104px 1fr; gap: 12px; }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; border-radius: 12px 0 0 12px; background: var(--c); box-shadow: 0 0 12px var(--c); }
  .card.hecho { opacity: 0.5; }
  .card video { width: 104px; aspect-ratio: 9/16; object-fit: cover; border-radius: 8px; background: #000; border: 1px solid var(--linea); max-width: 100%; }
  .cuerpo { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font: 700 11px var(--leer); letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; color: var(--casco); background: var(--c); }
  .hora { font-family: var(--reloj); font-size: 13px; color: var(--cian-suave); }
  .titulo { font: 700 17px/1.2 var(--leer); margin: 0; }
  .campo { background: var(--casco); border: 1px solid var(--linea); border-radius: 8px; padding: 8px 9px; }
  .campo .cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 700 11px var(--leer); letter-spacing: 0.12em; text-transform: uppercase; color: var(--cian-suave); margin-bottom: 4px; }
  .campo .txt { font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
  .nota { font-size: 14px; color: var(--ambar); }
  .btn { appearance: none; font: 700 14px var(--leer); letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto); background: var(--panel-2); border: 1px solid var(--linea); border-radius: 8px; padding: 9px 12px; cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
  .btn:hover { border-color: var(--cian); }
  .btn.cian { background: var(--cian); color: var(--casco); border-color: var(--cian); }
  .btn.mini { padding: 3px 8px; font-size: 12px; color: var(--cian); background: transparent; border-color: var(--linea); }
  .btn:focus-visible, select:focus-visible, input:focus-visible, .tab:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }
  .fila { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks { display: flex; flex-wrap: wrap; gap: 14px; }
  .checks label { display: inline-flex; gap: 7px; align-items: center; font-weight: 700; cursor: pointer; }
  .checks input { width: 20px; height: 20px; accent-color: var(--verde); }
  .vistas { width: 100%; background: var(--casco); color: var(--texto); border: 1px solid var(--linea); border-radius: 8px; padding: 8px; font: 500 15px var(--leer); }
  select { background: var(--panel-2); color: var(--texto); border: 1px solid var(--linea); border-radius: 8px; padding: 9px 10px; font: 600 15px var(--leer); }
  .vacio { border: 1px dashed var(--linea); border-radius: 12px; padding: 22px; text-align: center; color: var(--cian-suave); }
  /* Sala de máquinas */
  .conexiones { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .con { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; }
  .luz { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; background: var(--l); box-shadow: 0 0 10px var(--l); }
  .con b { display: block; font-size: 16px; }
  .con small { color: var(--cian-suave); font-size: 14px; }
  .linea-prod { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 700 13px var(--leer); letter-spacing: 0.06em; text-transform: uppercase; }
  .linea-prod span { border: 1px solid var(--linea); background: var(--panel); border-radius: 6px; padding: 5px 8px; }
  .linea-prod i { color: var(--cian); font-style: normal; }
  .modulos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .modulo { background: var(--panel); border: 1px solid var(--linea); border-top: 3px solid var(--c); border-radius: 10px; padding: 10px; display: grid; gap: 4px; }
  .modulo b { font: 800 13px var(--hud); letter-spacing: 0.08em; text-transform: uppercase; }
  .barra { height: 8px; background: var(--casco); border: 1px solid var(--linea); border-radius: 99px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--c); }
  .modulo small { font-family: var(--reloj); color: var(--cian-suave); }
  .lista { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .guia { display: grid; gap: 10px; }
  .paso { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
  .paso .n { font: 800 22px var(--hud); color: var(--cian); text-align: center; }
  .paso p { margin: 0; }
  /* Consola de pestañas */
  .consola { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: rgba(5,8,15,0.94); border-top: 1px solid var(--linea); backdrop-filter: blur(8px); }
  .consola .tabs { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tab { appearance: none; background: var(--panel); color: var(--cian-suave); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 4px; font: 800 11px var(--hud); letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--casco); background: var(--cian); border-color: var(--cian); box-shadow: 0 0 16px rgba(41,231,255,0.45); }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--cian); color: var(--casco); padding: 8px 14px; border-radius: 8px; font-weight: 700; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="cabina" aria-label="Estado general">
    <div class="top">
      <h1>Puente de mando · <span>La Fábrica</span></h1>
      <div class="reloj-tx" id="reloj">--:-- TEXAS</div>
    </div>
    <div class="lecturas" id="lecturas"></div>
    <div class="lanzamiento" id="lanzamiento" hidden>
      <div class="cuenta mono" id="cuenta">00:00</div>
      <div><div class="lbl">Siguiente lanzamiento</div><div class="que" id="que"></div></div>
    </div>
  </section>

  <main id="vista"></main>
</div>

<nav class="consola" aria-label="Secciones">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="mision" aria-selected="true">Misión</button>
    <button class="tab" role="tab" data-t="calendario" aria-selected="false">Calendario</button>
    <button class="tab" role="tab" data-t="maquinas" aria-selected="false">Máquinas</button>
    <button class="tab" role="tab" data-t="guia" aria-selected="false">Guía</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
const SERIES = {
  ovni: { n: "OVNI", c: "var(--ovni)" }, roswell: { n: "Roswell", c: "var(--archivo)" }, apolo: { n: "NASA", c: "var(--archivo)" },
  poli: { n: "Persecución", c: "var(--poli)" }, historia: { n: "Historia", c: "var(--historia)" }, ketone: { n: "Ketone-IQ", c: "var(--ketone)" },
};
const LUZ = { ok: "var(--verde)", aviso: "var(--ambar)", off: "var(--rojo)" };
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
let data = { videos: [], fabrica: {} }, tab = "mision";

// Estado de cada video en este dispositivo (palomitas y vistas), encima de lo que dice data.json.
const KEY = "puente-estado-v1";
let estado = {}; try { estado = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { estado = {}; }
const guardarEstado = () => { try { localStorage.setItem(KEY, JSON.stringify(estado)); } catch {} };
const val = (v, k) => (estado[v.id] && k in estado[v.id] ? estado[v.id][k] : v[k]);
const hecho = (v) => (v.serie === "ketone" ? !!val(v, "tiktok") : !!(val(v, "tiktok") && val(v, "youtube")));

// Hora de Texas (America/Chicago) sin depender del huso del celular.
function texas() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  return { fecha: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute, seg: +p.second, hhmm: `${p.hour % 24}:${p.minute}`.padStart(5, "0") };
}
const aMin = (h) => { const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(h || ""); if (!m) return null; let hh = +m[1] % 12; if (/PM/i.test(m[3])) hh += 12; return hh * 60 + +m[2]; };
const fmtDia = (iso) => { const d = new Date(iso + "T12:00:00"); return `${DIAS[d.getDay()]} ${d.getDate()} de ${d.toLocaleString("es-MX", { month: "long" })}`; };

function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 1600); }
async function copiar(txt, nodo) {
  try { await navigator.clipboard.writeText(txt); toast("Copiado"); }
  catch { const r = document.createRange(); r.selectNodeContents(nodo); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Seleccionado: copia con el menú"); }
}

function tarjeta(v) {
  const s = SERIES[v.serie] || { n: v.serie, c: "var(--linea)" };
  const c = el("article", "card" + (hecho(v) ? " hecho" : "")); c.style.setProperty("--c", s.c);
  const vid = el("video"); vid.src = v.video; vid.preload = "metadata"; vid.controls = true; vid.playsInline = true;
  const b = el("div", "cuerpo");
  const meta = el("div", "meta"); meta.append(el("span", "chip", s.n), el("span", "hora", v.hora ? `TikTok ${v.hora} · YT ${v.horaYT || "-"}` : "En espera"));
  b.append(meta, el("p", "titulo", v.titulo));
  const campo = (lbl, txt) => { const f = el("div", "campo"), cab = el("div", "cab"), t = el("div", "txt", txt), btn = el("button", "btn mini", "Copiar"); btn.onclick = () => copiar(txt, t); cab.append(el("span", null, lbl), btn); f.append(cab, t); return f; };
  b.append(campo("Texto TikTok / descripción", v.caption));
  if (v.ytTitle) b.append(campo("Título YouTube", v.ytTitle));
  if (v.nota) b.append(el("div", "nota", v.nota));
  const fila = el("div", "fila"); const dl = el("a", "btn cian", "Guardar video"); dl.href = v.video; dl.download = v.id + ".mp4"; fila.append(dl); b.append(fila);
  const checks = el("div", "checks");
  const chk = (k, lbl) => { const l = el("label"), i = el("input"); i.type = "checkbox"; i.checked = !!val(v, k); i.onchange = () => { (estado[v.id] ||= {})[k] = i.checked; guardarEstado(); render(); }; l.append(i, document.createTextNode(lbl)); return l; };
  checks.append(chk("tiktok", "TikTok"), v.serie === "ketone" ? chk("vyro", "Registrado en Vyro") : chk("youtube", "YouTube"));
  b.append(checks);
  const vi = el("input", "vistas"); vi.placeholder = "Vistas / notas (ej. TikTok 1.2K · YT 300)"; vi.value = val(v, "vistas") || "";
  vi.onchange = () => { (estado[v.id] ||= {}).vistas = vi.value.trim(); guardarEstado(); };
  b.append(vi);
  c.append(vid, b); return c;
}

function grupoDias(lista) {
  const frag = document.createDocumentFragment(), porDia = new Map();
  lista.forEach((v) => { const k = v.fecha || "zz"; porDia.has(k) || porDia.set(k, []); porDia.get(k).push(v); });
  [...porDia.keys()].sort().forEach((k) => {
    frag.append(el("h2", null, k === "zz" ? "En espera (Ketone-IQ)" : fmtDia(k) + (k === texas().fecha ? " · HOY" : "")));
    const g = el("div", "grid"); porDia.get(k).sort((a, b) => (a.orden || 0) - (b.orden || 0)).forEach((v) => g.append(tarjeta(v))); frag.append(g);
  });
  return frag;
}

function vistaMision() {
  const t = texas(), f = document.createDocumentFragment();
  const hoy = data.videos.filter((v) => v.fecha === t.fecha);
  f.append(el("h2", null, "Misión de hoy"), el("p", "sub", hoy.length ? "Sube cada uno a su hora. Cuando termines, pícale su palomita." : "Hoy no hay lanzamientos programados."));
  if (hoy.length) { const g = el("div", "grid"); hoy.sort((a, b) => a.orden - b.orden).forEach((v) => g.append(tarjeta(v))); f.append(g); }
  const atrasados = data.videos.filter((v) => v.fecha && v.fecha < t.fecha && !hecho(v));
  if (atrasados.length) { f.append(el("h2", null, "Atrasados"), el("p", "sub", "Se quedaron sin subir. Súbelos en un hueco libre.")); const g = el("div", "grid"); atrasados.forEach((v) => g.append(tarjeta(v))); f.append(g); }
  return f;
}

function vistaCalendario() {
  const f = document.createDocumentFragment();
  const barra = el("div", "fila");
  const selE = el("select"); selE.setAttribute("aria-label", "Estado"); [["pend", "Pendientes"], ["todos", "Todos"], ["hechos", "Ya subidos"]].forEach(([k, n]) => { const o = el("option", null, n); o.value = k; selE.append(o); });
  const selS = el("select"); selS.setAttribute("aria-label", "Serie"); selS.append(Object.assign(el("option", null, "Todas las series"), { value: "" }));
  Object.entries(SERIES).forEach(([k, s]) => selS.append(Object.assign(el("option", null, s.n), { value: k })));
  selE.value = vistaCalendario.e || "pend"; selS.value = vistaCalendario.s || "";
  const cont = el("div");
  const pinta = () => {
    vistaCalendario.e = selE.value; vistaCalendario.s = selS.value;
    let l = data.videos.filter((v) => !selS.value || v.serie === selS.value);
    if (selE.value === "pend") l = l.filter((v) => !hecho(v)); if (selE.value === "hechos") l = l.filter(hecho);
    cont.replaceChildren(l.length ? grupoDias(l) : el("div", "vacio", "Nada en este filtro."));
  };
  selE.onchange = selS.onchange = pinta; barra.append(selE, selS); f.append(el("h2", null, "Calendario de lanzamientos"), barra, cont); pinta();
  return f;
}

function vistaMaquinas() {
  const fb = data.fabrica || {}, f = document.createDocumentFragment();
  f.append(el("h2", null, "Línea de producción"));
  const lp = el("div", "linea-prod"); (fb.linea || []).forEach((p, i) => { if (i) lp.append(el("i", null, "→")); lp.append(el("span", null, p)); }); f.append(lp);
  f.append(el("h2", null, "Módulos"));
  const mods = el("div", "modulos");
  Object.entries(SERIES).forEach(([k, s]) => {
    const vs = data.videos.filter((v) => v.serie === k); if (!vs.length) return;
    const h = vs.filter(hecho).length, m = el("div", "modulo"); m.style.setProperty("--c", s.c);
    const barra = el("div", "barra"), i = el("i"); i.style.width = Math.round((h / vs.length) * 100) + "%"; barra.append(i);
    m.append(el("b", null, s.n), barra, el("small", null, `${h}/${vs.length} en órbita`)); mods.append(m);
  });
  f.append(mods, el("h2", null, "Conexiones"));
  const cs = el("div", "conexiones");
  (fb.conexiones || []).forEach((c) => { const d = el("div", "con"), luz = el("span", "luz"); luz.style.setProperty("--l", LUZ[c.estado] || "var(--linea)"); const t = el("div"); t.append(el("b", null, c.nombre), el("small", null, c.detalle)); d.append(luz, t); cs.append(d); });
  f.append(cs);
  if (fb.enCola?.length) { f.append(el("h2", null, "En producción")); const ul = el("ul", "lista"); fb.enCola.forEach((x) => ul.append(el("li", null, x))); f.append(ul); }
  f.append(el("h2", null, "Pedidos a la fábrica"), el("p", "sub", "¿Viste un video o tema que quieres? Escríbelo aquí y se abre como pedido en GitHub, donde Claude lo recoge."));
  const fila = el("div", "fila"); const inp = el("input", "vistas"); inp.placeholder = "Ej. más persecuciones de noche, o pega un enlace";
  const btn = el("a", "btn cian", "Enviar pedido"); btn.target = "_blank"; btn.rel = "noopener";
  const upd = () => { btn.href = "https://github.com/dj0hnc/MyStuff/issues/new?labels=pedido&title=" + encodeURIComponent("Pedido: " + (inp.value.trim() || "video nuevo")) + "&body=" + encodeURIComponent(inp.value.trim()); };
  inp.oninput = upd; upd(); fila.append(inp, btn); f.append(fila);
  return f;
}

function vistaGuia() {
  const f = document.createDocumentFragment();
  f.append(el("h2", null, "Cómo subir un video"), el("p", "sub", "Para JOHNC y Karen. Toma 2 minutos por video."));
  const pasos = [
    ["Abre MISIÓN.", "Ahí salen los videos de hoy en orden, con su hora de Texas. El reloj de arriba cuenta cuánto falta para el siguiente."],
    ["Toca GUARDAR VIDEO.", "Se baja a tu celular (en iPhone: mantén presionado y elige Descargar si hace falta)."],
    ["Toca COPIAR en el texto de TikTok.", "Abre TikTok, sube el video y pega el texto. Sin música de TikTok: el video ya trae su audio."],
    ["Pícale la palomita TikTok.", "30 minutos después súbelo a YouTube Shorts: copia el título y el texto, y pícale YouTube."],
    ["Ketone-IQ es distinto.", "Activa Branded content en TikTok y registra el enlace en Vyro. Los demás NO llevan Branded content."],
    ["Anota las vistas.", "Al día siguiente escribe las vistas en la cajita del video. Con eso se decide qué se produce después."],
  ];
  const g = el("div", "guia"); pasos.forEach(([a, b], i) => { const p = el("div", "paso"), t = el("div"); t.append(el("p", null, a)); t.lastChild.style.fontWeight = "700"; t.append(el("p", "sub", b)); p.append(el("div", "n", String(i + 1)), t); g.append(p); });
  f.append(g, el("h2", null, "Accesos rápidos"));
  const fila = el("div", "fila");
  [["Subir a TikTok", "https://www.tiktok.com/upload"], ["Subir a YouTube", "https://www.youtube.com/upload"], ["Analytics TikTok", "https://www.tiktok.com/tiktokstudio/analytics"], ["YouTube Studio", "https://studio.youtube.com"], ["Vyro", "https://vyro.com"]]
    .forEach(([n, u]) => { const a = el("a", "btn", n); a.href = u; a.target = "_blank"; a.rel = "noopener"; fila.append(a); });
  f.append(fila, el("p", "sub", "Las palomitas y vistas se guardan en este celular. Datos actualizados por Claude: " + (data.actualizado || "-")));
  return f;
}

function lecturas() {
  const t = texas(), total = data.videos.length, sub = data.videos.filter(hecho).length;
  const hoyPend = data.videos.filter((v) => v.fecha === t.fecha && !hecho(v)).length;
  const L = $("#lecturas"); L.replaceChildren();
  [["Videos", total, ""], ["En órbita", sub, "verde"], ["Por lanzar", total - sub, ""], ["Hoy", hoyPend, "ambar"]].forEach(([n, x, cl]) => { const d = el("div", "lectura " + cl); d.append(el("b", null, String(x)), el("span", null, n)); L.append(d); });
}

function reloj() {
  const t = texas(); $("#reloj").textContent = `${t.hhmm} TEXAS`;
  const prox = data.videos.filter((v) => v.fecha === t.fecha && !val(v, "tiktok") && aMin(v.hora) != null && aMin(v.hora) >= t.min).sort((a, b) => aMin(a.hora) - aMin(b.hora))[0];
  const box = $("#lanzamiento");
  if (!prox) { box.hidden = true; return; }
  const falta = (aMin(prox.hora) - t.min) * 60 - t.seg, h = Math.floor(falta / 3600), m = Math.floor((falta % 3600) / 60), s = falta % 60;
  $("#cuenta").textContent = (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  $("#que").textContent = `${prox.hora} · ${(SERIES[prox.serie] || {}).n || ""} · ${prox.titulo}`;
  box.hidden = false;
}

function render() {
  lecturas();
  const V = { mision: vistaMision, calendario: vistaCalendario, maquinas: vistaMaquinas, guia: vistaGuia }[tab];
  const act = document.activeElement; if (act && act.classList.contains("vistas")) return;
  $("#vista").replaceChildren(V());
}

document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
  tab = b.dataset.t; document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  scrollTo({ top: 0 }); render();
}));

fetch("data.json", { cache: "no-store" }).then((r) => r.json()).then((d) => { data = d; render(); reloj(); setInterval(reloj, 1000); })
  .catch(() => { $("#vista").replaceChildren(el("div", "vacio", "No se pudo cargar la lista. Revisa tu conexión y recarga.")); });
</script>
</body>
</html>
