<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>Fábrica de Clips · Puente de Mando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
  :root {
    color-scheme: dark;
    --casco: #05080f;
    --panel: #0a1322;
    --panel-2: #0f1c30;
    --linea: #1b3656;
    --cian: #29e7ff;
    --cian-suave: #7fb8d6;
    --texto: #d6ecff;
    --ambar: #ffb020;
    --verde: #39ff88;
    --rojo: #ff4d4d;
    --ovni: #39ff88;
    --poli: #ff4d4d;
    --historia: #ffd60a;
    --archivo: #e0a95e;
    --ketone: #6fc3ff;
    --hud: "Orbitron", "Rajdhani", system-ui, sans-serif;
    --leer: "Rajdhani", system-ui, -apple-system, "Segoe UI", sans-serif;
    --reloj: "Share Tech Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -200px, #0d2440 0%, transparent 60%),
      repeating-linear-gradient(0deg, rgba(41,231,255,0.035) 0 1px, transparent 1px 4px),
      var(--casco);
    color: var(--texto); font: 500 16px/1.4 var(--leer);
    padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 16px; }
  /* Cabina */
  .cabina { display: grid; gap: 10px; border: 1px solid var(--linea); background: linear-gradient(180deg, rgba(15,28,48,0.9), rgba(10,19,34,0.9)); border-radius: 14px; padding: 14px 16px; position: relative; }
  .cabina::before, .cabina::after { content: ""; position: absolute; width: 18px; height: 18px; border: 2px solid var(--cian); }
  .cabina::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  .cabina::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  h1 { font: 800 clamp(18px, 4.6vw, 26px)/1.1 var(--hud); letter-spacing: 0.06em; margin: 0; text-transform: uppercase; }
  h1 span { color: var(--cian); }
  .reloj-tx { font-family: var(--reloj); color: var(--cian); font-size: 15px; letter-spacing: 0.05em; }
  .lecturas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .lectura { background: var(--casco); border: 1px solid var(--linea); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; }
  .lectura b { font: 400 clamp(20px, 6vw, 30px)/1 var(--reloj); color: var(--cian); font-variant-numeric: tabular-nums; }
  .lectura span { font-size: 12px; color: var(--cian-suave); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
  .lectura.ambar b { color: var(--ambar); } .lectura.verde b { color: var(--verde); }
  @media (max-width: 480px) { .lecturas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* Siguiente lanzamiento */
  .lanzamiento { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; border: 1px solid var(--ambar); border-radius: 12px; padding: 10px 14px; background: rgba(255,176,32,0.07); }
  .lanzamiento .cuenta { font: 400 clamp(26px, 8vw, 40px)/1 var(--reloj); color: var(--ambar); font-variant-numeric: tabular-nums; }
  .lanzamiento .lbl { font: 700 12px var(--leer); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ambar); }
  .lanzamiento .que { font-weight: 700; font-size: 17px; }
  h2 { font: 800 14px var(--hud); letter-spacing: 0.14em; text-transform: uppercase; color: var(--cian); margin: 6px 0 0; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--linea), transparent); }
  .sub { color: var(--cian-suave); margin: 0; font-size: 15px; }
  main { display: grid; gap: 12px; }
  /* Tarjetas de video */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
  .card { position: relative; background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 104px 1fr; gap: 12px; }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; border-radius: 12px 0 0 12px; background: var(--c); box-shadow: 0 0 12px var(--c); }
  .card.hecho { opacity: 0.5; }
  .card video { width: 104px; aspect-ratio: 9/16; object-fit: cover; border-radius: 8px; background: #000; border: 1px solid var(--linea); max-width: 100%; }
  .cuerpo { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font: 700 11px var(--leer); letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; color: var(--casco); background: var(--c); }
  .hora { font-family: var(--reloj); font-size: 13px; color: var(--cian-suave); }
  .titulo { font: 700 17px/1.2 var(--leer); margin: 0; }
  .campo { background: var(--casco); border: 1px solid var(--linea); border-radius: 8px; padding: 8px 9px; }
  .campo .cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 700 11px var(--leer); letter-spacing: 0.12em; text-transform: uppercase; color: var(--cian-suave); margin-bottom: 4px; }
  .campo .txt { font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
  .nota { font-size: 14px; color: var(--ambar); }
  .btn { appearance: none; font: 700 14px var(--leer); letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto); background: var(--panel-2); border: 1px solid var(--linea); border-radius: 8px; padding: 9px 12px; cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
  .btn:hover { border-color: var(--cian); }
  .btn.cian { background: var(--cian); color: var(--casco); border-color: var(--cian); }
  .btn.mini { padding: 3px 8px; font-size: 12px; color: var(--cian); background: transparent; border-color: var(--linea); }
  .btn:focus-visible, select:focus-visible, input:focus-visible, .tab:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }
  .fila { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks { display: flex; flex-wrap: wrap; gap: 14px; }
  .checks label { display: inline-flex; gap: 7px; align-items: center; font-weight: 700; cursor: pointer; }
  .checks input { width: 20px; height: 20px; accent-color: var(--verde); }
  .vistas { width: 100%; background: var(--casco); color: var(--texto); border: 1px solid var(--linea); border-radius: 8px; padding: 8px; font: 500 15px var(--leer); }
  select { background: var(--panel-2); color: var(--texto); border: 1px solid var(--linea); border-radius: 8px; padding: 9px 10px; font: 600 15px var(--leer); }
  .vacio { border: 1px dashed var(--linea); border-radius: 12px; padding: 22px; text-align: center; color: var(--cian-suave); }
  /* Sala de máquinas */
  .conexiones { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .con { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; }
  .luz { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; background: var(--l); box-shadow: 0 0 10px var(--l); }
  .con b { display: block; font-size: 16px; }
  .con small { color: var(--cian-suave); font-size: 14px; }
  .linea-prod { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 700 13px var(--leer); letter-spacing: 0.06em; text-transform: uppercase; }
  .linea-prod span { border: 1px solid var(--linea); background: var(--panel); border-radius: 6px; padding: 5px 8px; }
  .linea-prod i { color: var(--cian); font-style: normal; }
  .modulos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .modulo { background: var(--panel); border: 1px solid var(--linea); border-top: 3px solid var(--c); border-radius: 10px; padding: 10px; display: grid; gap: 4px; }
  .modulo b { font: 800 13px var(--hud); letter-spacing: 0.08em; text-transform: uppercase; }
  .barra { height: 8px; background: var(--casco); border: 1px solid var(--linea); border-radius: 99px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--c); }
  .modulo small { font-family: var(--reloj); color: var(--cian-suave); }
  .lista { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
  .guia { display: grid; gap: 10px; }
  .paso { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
  .paso .n { font: 800 22px var(--hud); color: var(--cian); text-align: center; }
  .paso p { margin: 0; }
  /* Consola de pestañas */
  .consola { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: rgba(5,8,15,0.94); border-top: 1px solid var(--linea); backdrop-filter: blur(8px); }
  .consola .tabs { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tab { appearance: none; background: var(--panel); color: var(--cian-suave); border: 1px solid var(--linea); border-radius: 10px; padding: 10px 2px; font: 800 10px var(--hud); letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--casco); background: var(--cian); border-color: var(--cian); box-shadow: 0 0 16px rgba(41,231,255,0.45); }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--cian); color: var(--casco); padding: 8px 14px; border-radius: 8px; font-weight: 700; }

  .enlace { display: inline-flex; align-items: center; gap: 8px; font: 400 13px var(--reloj); color: var(--cian-suave); }
  .enlace i { width: 10px; height: 10px; border-radius: 50%; background: var(--l, var(--ambar)); box-shadow: 0 0 10px var(--l, var(--ambar)); }
  .tripu { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tripu .btn[aria-pressed="true"] { background: var(--cian); color: var(--casco); border-color: var(--cian); }
  .num { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .num label { display: grid; gap: 3px; font: 700 11px var(--leer); letter-spacing: 0.1em; text-transform: uppercase; color: var(--cian-suave); }
  .num input { background: var(--casco); color: var(--texto); border: 1px solid var(--linea); border-radius: 8px; padding: 7px 8px; font: 400 16px var(--reloj); width: 100%; }
  .por { font-size: 12px; color: var(--cian-suave); font-family: var(--reloj); }
  .ranking { display: grid; gap: 8px; }
  .rk { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--linea); border-left: 4px solid var(--c); border-radius: 10px; padding: 8px 12px; }
  .rk .pos { font: 800 18px var(--hud); color: var(--cian); text-align: center; }
  .rk .v { font: 400 18px var(--reloj); color: var(--verde); font-variant-numeric: tabular-nums; }
  .rk small { display: block; color: var(--cian-suave); font-size: 13px; }
  .barras { display: grid; gap: 8px; }
  .br { display: grid; grid-template-columns: 110px 1fr 70px; gap: 10px; align-items: center; font-weight: 700; }
  .br .pista { height: 14px; background: var(--casco); border: 1px solid var(--linea); border-radius: 99px; overflow: hidden; }
  .br .pista i { display: block; height: 100%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .br span:last-child { font-family: var(--reloj); text-align: right; color: var(--cian-suave); }
  .log { display: grid; gap: 6px; max-height: 360px; overflow: auto; }
  .log div { background: var(--panel); border: 1px solid var(--linea); border-radius: 8px; padding: 7px 10px; font-size: 14px; }
  .log b { color: var(--cian); } .log time { float: right; font-family: var(--reloj); color: var(--cian-suave); font-size: 12px; }
  .ped { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 8px 12px; }
  .ped small { display: block; color: var(--cian-suave); font-family: var(--reloj); font-size: 12px; }
  .aviso-banda { border: 1px solid var(--ambar); background: rgba(255,176,32,0.08); color: var(--ambar); border-radius: 10px; padding: 8px 12px; font-size: 14px; }

  .fab { position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 999px; border: 1px solid var(--cian); background: rgba(5,8,15,0.92); color: var(--cian); font: 800 12px var(--hud); letter-spacing: 0.12em; cursor: pointer; box-shadow: 0 0 22px rgba(41,231,255,0.35); }
  .fab i { width: 9px; height: 9px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 10px var(--verde); }
  .sala { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-rows: auto 1fr auto auto; background: radial-gradient(900px 500px at 50% -150px, #0d2440 0%, transparent 60%), var(--casco); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .sala-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--linea); max-width: 820px; width: 100%; margin: 0 auto; }
  .sala-top b { font: 800 14px var(--hud); letter-spacing: 0.14em; color: var(--cian); }
  .sala-top small { display: block; color: var(--cian-suave); font-size: 13px; }
  .burbujas { overflow: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px 2px; max-width: 820px; width: 100%; margin: 0 auto; }
  .bur { max-width: 92%; padding: 10px 13px; border-radius: 14px; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
  .bur p { margin: 0 0 8px; } .bur p:last-child { margin-bottom: 0; }
  .bur ul { margin: 4px 0 8px; padding-left: 20px; display: grid; gap: 4px; }
  .bur h4 { margin: 6px 0; font: 800 13px var(--hud); letter-spacing: 0.08em; color: var(--cian); }
  .bur b { color: #fff; } .bur code { font-family: var(--reloj); background: var(--casco); padding: 1px 5px; border-radius: 4px; }
  .bur a { color: var(--cian); }
  .bur.yo { align-self: flex-end; background: var(--cian); color: var(--casco); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bur.fabrica { align-self: flex-start; background: var(--panel); border: 1px solid var(--linea); border-bottom-left-radius: 4px; }
  .bur .quien { display: block; font: 800 10px var(--hud); letter-spacing: 0.14em; color: var(--cian); margin-bottom: 4px; }
  .bur.pedido { align-self: flex-start; background: rgba(57,255,136,0.1); border: 1px solid var(--verde); color: var(--verde); font-weight: 700; }
  .pensando { align-self: flex-start; display: inline-flex; gap: 5px; padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--linea); }
  .pensando span { width: 7px; height: 7px; border-radius: 50%; background: var(--cian); animation: late 1s infinite ease-in-out; }
  .pensando span:nth-child(2) { animation-delay: 0.15s; } .pensando span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes late { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0; max-width: 820px; width: 100%; margin: 0 auto; }
  .chips button { flex: none; border: 1px solid var(--linea); background: var(--panel); color: var(--texto); border-radius: 999px; padding: 8px 12px; font: 600 14px var(--leer); cursor: pointer; }
  .chips button:hover { border-color: var(--cian); }
  .compositor { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; max-width: 820px; width: 100%; margin: 0 auto; }
  .compositor textarea { resize: none; max-height: 160px; background: var(--panel); color: var(--texto); border: 1px solid var(--linea); border-radius: 14px; padding: 12px; font: 500 16px/1.4 var(--leer); }
  .compositor .btn { height: 48px; border-radius: 14px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="cabina" aria-label="Estado general">
    <div class="top">
      <h1><a href="/" style="color:var(--cian-suave);text-decoration:none" aria-label="Volver a paneles">‹</a> Fábrica de <span>Clips</span></h1>
      <div class="fila" style="align-items:center"><span class="enlace" id="enlace"><i></i><span>CONECTANDO…</span></span><div class="reloj-tx" id="reloj">--:-- TEXAS</div></div>
    </div>
    <div class="tripu" id="tripu"></div>
    <div class="lecturas" id="lecturas"></div>
    <div class="lanzamiento" id="lanzamiento" hidden>
      <div class="cuenta mono" id="cuenta">00:00</div>
      <div><div class="lbl">Siguiente lanzamiento</div><div class="que" id="que"></div></div>
    </div>
  </section>

  <main id="vista"></main>
</div>

<nav class="consola" aria-label="Secciones">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="mision" aria-selected="true">Misión</button>
    <button class="tab" role="tab" data-t="calendario" aria-selected="false">Calendario</button>
    <button class="tab" role="tab" data-t="radar" aria-selected="false">Radar</button>
    <button class="tab" role="tab" data-t="maquinas" aria-selected="false">Máquinas</button>
    <button class="tab" role="tab" data-t="guia" aria-selected="false">Guía</button>
  </div>
</nav>
<button class="fab" id="fab" type="button" aria-label="Abrir la Consola de la Fábrica"><i></i>CONSOLA</button>
<section class="sala" id="sala" hidden aria-label="Consola de la Fábrica">
  <div class="sala-top"><div><b>CONSOLA DE LA FÁBRICA</b><small>Platica ideas; di "hazlo" y queda como pedido.</small></div><div class="fila"><button class="btn mini" id="salaNueva" type="button">Nueva</button><button class="btn" id="salaCerrar" type="button">Cerrar</button></div></div>
  <div class="burbujas" id="burbujas" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="compositor" id="compositor"><textarea id="entrada" rows="1" maxlength="2000" placeholder="Escribe tu idea o pega un enlace…" aria-label="Mensaje"></textarea><button class="btn cian" type="submit" id="enviar">Enviar</button></form>
</section>
<div class="toast" id="toast" hidden></div>

<script>
const SERIES = {
  ovni: { n: "OVNI", c: "var(--ovni)" }, roswell: { n: "Roswell", c: "var(--archivo)" }, apolo: { n: "NASA", c: "var(--archivo)" },
  poli: { n: "Persecución", c: "var(--poli)" }, historia: { n: "Historia", c: "var(--historia)" }, ketone: { n: "Ketone-IQ", c: "var(--ketone)" },
};
const TRIPULACION = ["Juan", "Karen"];
const LUZ = { ok: "var(--verde)", aviso: "var(--ambar)", off: "var(--rojo)" };
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const ls = { get: (k, d) => { try { const x = localStorage.getItem(k); return x == null ? d : JSON.parse(x); } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

let data = { videos: [], fabrica: {} }, tab = "mision";
// Estado compartido (servidor). Si no hay servidor, se guarda en este celular y se avisa.
let srv = { videos: {}, pedidos: [], bitacora: [] }, enLinea = false;
let quien = ls.get("puente-quien", ""), pin = ls.get("puente-pin", "");

const val = (v, k) => { const s = srv.videos[v.id]; return s && k in s ? s[k] : v[k]; };
const hecho = (v) => (v.serie === "ketone" ? !!val(v, "tiktok") : !!(val(v, "tiktok") && val(v, "youtube")));
const vistas = (v) => (Number(val(v, "vtt")) || 0) + (Number(val(v, "vyt")) || 0);

function texas() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  return { fecha: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute, seg: +p.second, hhmm: `${+p.hour % 24}:${p.minute}`.padStart(5, "0") };
}

  const L = $("#lecturas"); L.replaceChildren();
  [["En órbita", `${sub}/${total}`, "verde"], ["Hoy por lanzar", hoyPend, "ambar"], ["Vistas anotadas", fmtN(tv), ""], ["Pedidos nuevos", (srv.pedidos || []).filter((p) => p.estado === "nuevo").length, ""]]
    .forEach(([n, x, cl]) => { const d = el("div", "lectura " + cl); d.append(el("b", null, String(x)), el("span", null, n)); L.append(d); });
}

function reloj() {
  const t = texas(); $("#reloj").textContent = `${t.hhmm} TEXAS`;
  const prox = data.videos.filter((v) => v.fecha === t.fecha && !val(v, "tiktok") && aMin(v.hora) != null && aMin(v.hora) >= t.min).sort((a, b) => aMin(a.hora) - aMin(b.hora))[0];
  const box = $("#lanzamiento");
  if (!prox) { box.hidden = true; return; }
  const falta = (aMin(prox.hora) - t.min) * 60 - t.seg, h = Math.floor(falta / 3600), m = Math.floor((falta % 3600) / 60), s = falta % 60;
  $("#cuenta").textContent = (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  $("#que").textContent = `${prox.hora} · ${(SERIES[prox.serie] || {}).n || ""} · ${prox.titulo}`;
  box.hidden = false;
}

function render() {
  lecturas();
  if (!$("#sala").hidden) return;
  const act = document.activeElement; if (act && (act.classList.contains("vistas") || act.classList.contains("vistas-n") || act.tagName === "TEXTAREA")) return; // no pisar lo que se escribe
  const V = { mision: vistaMision, calendario: vistaCalendario, radar: vistaRadar, maquinas: vistaMaquinas, guia: vistaGuia }[tab];
  const y = scrollY; $("#vista").replaceChildren(V()); scrollTo({ top: y });
}

document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
  tab = b.dataset.t; document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  render(); scrollTo({ top: 0 });
}));

(async () => {
  barraTripu();
  try { data = await (await fetch("data.json", { cache: "no-store" })).json(); }
  catch { $("#vista").replaceChildren(el("div", "vacio", "No se pudo cargar la lista. Revisa tu conexión y recarga.")); return; }
  await traer(); render(); reloj(); setInterval(reloj, 1000);
  // Sincroniza con la tripulación cada 15 s (y al volver a la pestaña).
  setInterval(async () => { if (document.visibilityState === "visible") { await traer(); render(); } }, 15000);
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible") { await traer(); render(); } });
})();
</script>
