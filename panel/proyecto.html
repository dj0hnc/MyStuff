<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" href="/icono-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Puente">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0710">
<title>Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --fondo: #0c0710; --panel: #170f1c; --panel-2: #21152a; --linea: #3a2645;
    --texto: #f6ecf7; --suave: #c7a9cf; --a: #ff5fa2; --b: #ffc857; --ok: #5be49b;
    --tit: "Bebas Neue", Impact, sans-serif; --leer: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(900px 520px at 85% -120px, color-mix(in srgb, var(--a) 28%, transparent), transparent 60%),
                radial-gradient(700px 420px at -10% 10%, color-mix(in srgb, var(--b) 12%, transparent), transparent 60%), var(--fondo);
    color: var(--texto); font: 500 16px/1.45 var(--leer); min-height: 100vh;
    padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(100px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }
  a { color: var(--a); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .volver { color: var(--suave); text-decoration: none; font-weight: 700; font-size: 14px; }
  .volver:hover { color: var(--texto); }
  h1 { font: 400 clamp(40px, 11vw, 64px)/0.9 var(--tit); margin: 0; letter-spacing: 0.02em; }
  h1 span { color: var(--a); }
  .lema { margin: 4px 0 0; color: var(--suave); font-weight: 600; }
  .tripu { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--suave); font-weight: 700; }
  .btn { appearance: none; font: 700 14px var(--leer); color: var(--texto); background: var(--panel-2); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
  .btn:hover { border-color: var(--a); }
  .btn.a { background: var(--a); border-color: var(--a); color: #16080f; }
  .btn.mini { padding: 5px 10px; font-size: 12px; border-radius: 999px; }
  .btn[aria-pressed="true"] { background: var(--a); color: #16080f; border-color: var(--a); }
  .btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .tab:focus-visible { outline: 2px solid var(--b); outline-offset: 2px; }
  .meta { background: var(--panel); border: 1px solid var(--linea); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
  .meta .lbl { font: 800 12px var(--leer); letter-spacing: 0.12em; text-transform: uppercase; color: var(--b); }
  .meta .num { font: 400 clamp(34px, 10vw, 48px)/1 var(--tit); }
  .meta .num small { font: 600 15px var(--leer); color: var(--suave); }
  .barra { height: 14px; border-radius: 99px; background: var(--fondo); border: 1px solid var(--linea); overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--a), var(--b)); }
  .lecturas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 560px) { .lecturas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .lectura { background: var(--panel); border: 1px solid var(--linea); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
  .lectura b { font: 400 clamp(24px, 7vw, 32px)/1 var(--tit); color: var(--a); overflow-wrap: anywhere; }
  .lectura span { font-size: 12px; color: var(--suave); font-weight: 700; }
  h2 { font: 400 26px/1 var(--tit); letter-spacing: 0.04em; margin: 8px 0 0; display: flex; gap: 10px; align-items: center; }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--linea), transparent); }
  .sub { color: var(--suave); margin: 0; }
  main { display: grid; gap: 12px; }
  .grande { display: grid; gap: 6px; text-align: left; width: 100%; padding: 18px; border-radius: 18px; border: 1px solid var(--a); background: color-mix(in srgb, var(--a) 14%, var(--panel)); color: var(--texto); cursor: pointer; font: inherit; }
  .grande b { font: 400 30px/1 var(--tit); color: var(--a); letter-spacing: 0.03em; }
  .grande:hover { background: color-mix(in srgb, var(--a) 22%, var(--panel)); }
  .temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .tema { background: var(--panel); border: 1px solid var(--linea); border-top: 4px solid var(--c, var(--a)); border-radius: 16px; padding: 14px; display: grid; gap: 8px; align-content: start; }
  .tema h3 { margin: 0; font: 400 26px/1 var(--tit); letter-spacing: 0.03em; color: var(--c, var(--a)); }
  .tema p { margin: 0; color: var(--suave); font-size: 15px; }
  .tema ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 15px; }
  .fila { display: flex; flex-wrap: wrap; gap: 8px; }
  .caja { background: var(--panel); border: 1px solid var(--linea); border-radius: 14px; padding: 10px 12px; }
  .ped { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--linea); border-radius: 14px; padding: 10px 12px; }
  .ped small { display: block; color: var(--suave); font-size: 12px; margin-top: 2px; }
  .ped.listo { opacity: 0.7; }
  .nota { margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--b); background: var(--fondo); border-radius: 8px; font-size: 14px; }
  .nota p { margin: 0 0 6px; } .nota p:last-child { margin: 0; } .nota ul { margin: 4px 0; padding-left: 18px; }
  .listos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .listos figure { margin: 0; background: var(--panel); border: 1px solid var(--linea); border-radius: 14px; padding: 8px; display: grid; gap: 6px; }
  .listos video { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 10px; background: #000; }
  .listos figcaption { font-size: 13px; font-weight: 700; }
  .lectura, .meta.ir { cursor: pointer; } .lectura:hover, .meta.ir:hover { border-color: var(--a); }
  .hub { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .cuenta-red { background: var(--panel); border: 1px solid var(--linea); border-left: 4px solid var(--c, var(--a)); border-radius: 14px; padding: 12px; display: grid; gap: 8px; }
  .cuenta-red small { color: var(--suave); }
  select, .campo { background: var(--panel-2); color: var(--texto); border: 1px solid var(--linea); border-radius: 12px; padding: 10px; font: 600 15px var(--leer); }
  .campo { flex: 1; min-width: 200px; }
  .log { display: grid; gap: 6px; }
  .log div { background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
  .log b { color: var(--a); } .log time { float: right; color: var(--suave); font-size: 12px; }
  .vacio { border: 1px dashed var(--linea); border-radius: 14px; padding: 20px; text-align: center; color: var(--suave); }
  .paso { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
  .paso .n { font: 400 28px/1 var(--tit); color: var(--a); text-align: center; }
  .paso p { margin: 0; }
  .tabs-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--fondo) 94%, transparent); border-top: 1px solid var(--linea); backdrop-filter: blur(8px); z-index: 10; }
  .tabs { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tab { appearance: none; background: var(--panel); color: var(--suave); border: 1px solid var(--linea); border-radius: 12px; padding: 11px 4px; font: 800 13px var(--leer); letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--a); color: #16080f; border-color: var(--a); }
  .fab { position: fixed; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: inline-flex; align-items: center; gap: 8px; padding: 13px 18px; border-radius: 999px; border: 0; background: var(--a); color: #16080f; font: 800 14px var(--leer); cursor: pointer; box-shadow: 0 8px 28px color-mix(in srgb, var(--a) 45%, transparent); }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--b); color: #16080f; padding: 8px 14px; border-radius: 10px; font-weight: 800; z-index: 50; }
  /* Chat */
  .sala { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-rows: auto 1fr auto auto; background: radial-gradient(800px 460px at 90% -140px, color-mix(in srgb, var(--a) 22%, transparent), transparent 60%), var(--fondo); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .sala-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--linea); max-width: 820px; width: 100%; margin: 0 auto; }
  .sala-top b { font: 400 24px/1 var(--tit); letter-spacing: 0.04em; color: var(--a); }
  .sala-top small { display: block; color: var(--suave); font-size: 13px; }
  .burbujas { overflow: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px 2px; max-width: 820px; width: 100%; margin: 0 auto; }
  .bur { max-width: 92%; padding: 11px 14px; border-radius: 18px; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
  .bur p { margin: 0 0 8px; } .bur p:last-child { margin-bottom: 0; }
  .bur ul { margin: 4px 0 8px; padding-left: 20px; display: grid; gap: 4px; }
  .bur h4 { margin: 6px 0; font: 400 20px var(--tit); letter-spacing: 0.04em; color: var(--a); }
  .bur b { color: #fff; } .bur a { color: var(--b); }
  .bur.yo { align-self: flex-end; background: var(--a); color: #16080f; border-bottom-right-radius: 5px; white-space: pre-wrap; font-weight: 600; }
  .bur.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--linea); border-bottom-left-radius: 5px; }
  .bur .quien { display: block; font: 800 10px var(--leer); letter-spacing: 0.14em; color: var(--a); margin-bottom: 4px; }
  .bur.pedido { align-self: flex-start; background: color-mix(in srgb, var(--ok) 12%, transparent); border: 1px solid var(--ok); color: var(--ok); font-weight: 700; }
  .pensando { align-self: flex-start; display: inline-flex; gap: 5px; padding: 13px 15px; border-radius: 18px; background: var(--panel); border: 1px solid var(--linea); }
  .pensando span { width: 7px; height: 7px; border-radius: 50%; background: var(--a); animation: late 1s infinite ease-in-out; }
  .pensando span:nth-child(2) { animation-delay: 0.15s; } .pensando span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes late { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0; max-width: 820px; width: 100%; margin: 0 auto; }
  .chips button { flex: none; border: 1px solid var(--linea); background: var(--panel); color: var(--texto); border-radius: 999px; padding: 8px 13px; font: 600 14px var(--leer); cursor: pointer; }
  .chips button:hover { border-color: var(--a); }
  .compositor { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; max-width: 820px; width: 100%; margin: 0 auto; }
  .compositor textarea { resize: none; max-height: 160px; background: var(--panel); color: var(--texto); border: 1px solid var(--linea); border-radius: 16px; padding: 12px; font: 500 16px/1.4 var(--leer); }
  .compositor .btn { height: 48px; border-radius: 16px; }
  @media (max-width: 560px) { .ped { grid-template-columns: 1fr; } }
  :root { --ta-bajo: 84px; } /* pastilla del Taller arriba de las pestañas */
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><a class="volver" href="/">← Inicio</a><h1 id="titulo"></h1><p class="lema" id="lema"></p></div>
    <div class="fila" style="align-items:center"><div class="tripu" id="tripu"></div><button class="btn mini" id="engrane" type="button" aria-label="Ajustes" style="font-size:18px;padding:4px 11px">⚙</button></div>
  </header>
  <main id="vista"><div class="vacio">Cargando…</div></main>
</div>
<nav class="tabs-bar" aria-label="Secciones"><div class="tabs" role="tablist">
  <button class="tab" role="tab" data-t="inicio" aria-selected="true">Inicio</button>
  <button class="tab" role="tab" data-t="videos" aria-selected="false">Videos</button>
  <button class="tab" role="tab" data-t="temas" aria-selected="false">Temas</button>
  <button class="tab" role="tab" data-t="ideas" aria-selected="false">Ideas</button>
</div></nav>
<button class="fab" id="fab" type="button">💬 <span id="fabTxt">Platicar</span></button>
<section class="sala" id="sala" hidden aria-label="Chat">
  <div class="sala-top"><div><b id="salaNombre"></b><small id="salaSub"></small></div><div class="fila"><button class="btn mini" id="salaHist" type="button">Historial</button><button class="btn mini" id="salaNueva" type="button">Nueva</button><button class="btn" id="salaCerrar" type="button">Cerrar</button></div></div>
  <div class="burbujas" id="burbujas" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="compositor" id="compositor"><textarea id="entrada" rows="1" maxlength="2000" placeholder="Escribe o pega un enlace…" aria-label="Mensaje"></textarea><button class="btn a" type="submit" id="enviar">Enviar</button></form>
</section>
<div class="toast" id="toast" hidden></div>

<script src="/publicar.js"></script>
<script src="/crudos.js"></script>
<script src="/ajustes.js"></script>
<script src="/historial.js"></script>
<script src="/taller.js"></script>
<script>
// Un solo archivo para los paneles de proyecto (/karen, /rave). La configuración vive en /proyectos/<id>.json
// y el cerebro del chat en /cerebro/<id>.md. El estado compartido va aparte por proyecto (/api/estado?p=<id>).
const P = (/^\/(karen|rave)\b/.exec(location.pathname) || [])[1] || new URLSearchParams(location.search).get("p") || "karen";
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const ls = { get: (k, d) => { try { const x = localStorage.getItem(k); return x == null ? d : JSON.parse(x); } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const hace = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "ahora" : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; };
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 1800); }

let cfg = {}, tab = "inicio", srv = { pedidos: [], bitacora: [] }, quien = "";
const EST = { nuevo: "Idea", produccion: "En proceso", listo: "Listo" };

async function traer() {
  try { const r = await fetch(`/api/estado?p=${P}`, { cache: "no-store" }); if (r.status === 401) return location.reload(); if (r.ok) srv = await r.json(); } catch {}
  aplicar();
}
// Ajustes compartidos del proyecto (⚙) encima de la configuración base del .json
function aplicar() {
  const a = srv.ajustes || {};
  cfg.tripulacion = a.tripulacion?.length ? a.tripulacion : cfg._base.tripulacion;
  cfg.redes = a.redes?.length ? a.redes : cfg._base.redes;
  cfg.ig = a.cuentas?.instagram || "";
}
async function enviar(cuerpo) {
  try {
    const r = await fetch(`/api/estado?p=${P}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...cuerpo, quien }) });
    if (r.status === 401) { location.reload(); return false; }
    if (!r.ok) throw 0; srv = await r.json(); aplicar(); render(); return true;
  } catch { toast("No se guardó. Revisa la señal."); return false; }
}

function barraTripu() {
  const b = $("#tripu"); b.replaceChildren(document.createTextNode("Soy:"));
  cfg.tripulacion.forEach((n) => { const x = el("button", "btn mini", n); x.type = "button"; x.setAttribute("aria-pressed", String(quien === n)); x.onclick = () => { quien = n; ls.set(`quien-${P}`, n); barraTripu(); toast(`Hola, ${n}`); }; b.append(x); });
}

function grande(titulo, texto, fn) { const b = el("button", "grande"); b.type = "button"; b.append(el("b", null, titulo), el("span", null, texto)); b.onclick = fn; return b; }

function vistaInicio() {
  const f = document.createDocumentFragment();
  if (cfg.meta) {
    const m = el("section", "meta"), pct = Math.min(100, (cfg.meta.actual / cfg.meta.objetivo) * 100), barra = el("div", "barra"), i = el("i");
    i.style.width = pct.toFixed(1) + "%"; barra.append(i);
    const num = el("div", "num", cfg.meta.actual.toLocaleString("es-MX")); num.append(el("small", null, ` / ${cfg.meta.objetivo.toLocaleString("es-MX")} ${cfg.meta.unidad}`));
    m.append(el("div", "lbl", cfg.meta.titulo), num, barra, el("p", "sub", cfg.meta.texto + (cfg.meta.url ? " Toca para ver tus estadísticas." : "")));
    if (cfg.meta.url) { m.classList.add("ir"); m.tabIndex = 0; m.setAttribute("role", "link"); m.onclick = () => ir(cfg.meta.url); }
    f.append(m);
  }
  const L = el("div", "lecturas");
  cfg.lecturas.forEach(([x, n, destino]) => { const d = el("div", "lectura"); d.append(el("b", null, x), el("span", null, n)); if (destino) { d.tabIndex = 0; d.setAttribute("role", "link"); d.onclick = () => ir(destino); d.onkeydown = (e) => e.key === "Enter" && ir(destino); } L.append(d); });
  f.append(L);
  if (cfg.videos?.length) f.append(el("h2", null, "Listos para subir"), listos());
  f.append(grande(cfg.botonGrande[0], cfg.botonGrande[1], () => abrirSala(cfg.botonGrande[2])));
  const pend = (srv.pedidos || []).filter((p) => p.estado !== "listo");
  f.append(el("h2", null, "Ideas en marcha"));
  if (pend.length) pend.slice(0, 5).forEach((p) => f.append(filaPedido(p))); else f.append(el("div", "vacio", "Todavía no hay ideas guardadas. Platica con el chat y dile \"apúntalo\"."));
  f.append(el("h2", null, "Cómo se usa"));
  cfg.pasos.forEach(([a, b], i) => { const p = el("div", "paso"), t = el("div"), pa = el("p", null, a); pa.style.fontWeight = "800"; t.append(pa, el("p", "sub", b)); p.append(el("div", "n", String(i + 1)), t); f.append(p); });
  f.append(el("h2", null, "Redes"), hub());
  if (srv.bitacora?.length) { f.append(el("h2", null, "Últimos movimientos")); const d = el("div", "log"); srv.bitacora.slice(0, 6).forEach((x) => { const r = el("div"); r.append(el("time", null, hace(x.at)), el("b", null, x.quien + " "), document.createTextNode(x.que)); d.append(r); }); f.append(d); }
  return f;
}

function ir(destino) { if (/^https?:/.test(destino)) window.open(destino, "_blank", "noopener"); else irTab(destino.replace("#", "")); }
function hub() { // cada botón abre el lugar exacto de la red
  const g = el("div", "hub");
  cfg.cuentas.map((c) => (cfg.ig && /^Instagram/.test(c.n) ? { ...c, n: "Instagram · @" + cfg.ig, l: [["Perfil", `https://www.instagram.com/${cfg.ig}/`], ...c.l.slice(1)] } : c)).forEach((c) => { const d = el("div", "cuenta-red"), fila = el("div", "fila"); if (c.c) d.style.setProperty("--c", c.c); c.l.forEach(([n, u]) => { const a = el("a", "btn mini", n); a.href = u; a.target = "_blank"; a.rel = "noopener"; fila.append(a); }); const t = el("b", null, c.n); d.append(t, el("small", null, c.d), fila); g.append(d); });
  return g;
}
function listos() {
  const g = el("div", "listos");
  (cfg.videos || []).slice().reverse().forEach((v) => {
    const fig = el("figure"), vid = el("video"); vid.src = v.video + "#t=1"; vid.preload = "metadata"; vid.muted = true; vid.playsInline = true;
    const b = el("button", "btn mini a", "Publicar ▶"); b.type = "button";
    const id = (v.id || v.video.split("/").pop().replace(/\.\w+$/, "")).replace(/[^\w-]/g, "-"), sv = () => srv.videos?.[id] || {};
    b.onclick = () => Publicar.abrir({ titulo: v.titulo, video: v.video, textos: { tiktok: v.caption, youtube: v.ytTitle || v.titulo, instagram: v.caption }, redes: v.redes || cfg.redes,
      hecho: { tiktok: !!sv().tiktok, youtube: !!sv().youtube, instagram: !!sv().instagram }, links: sv().links || {},
      onHecho: (red) => enviar({ tipo: "video", id, cambios: { [red]: true } }), onLink: (red, u) => enviar({ tipo: "video", id, cambios: { links: { [red]: u } } }) });
    if (Object.values(sv()).some((x) => x === true)) b.textContent = "Publicado ✓ · otra red";
    fig.append(vid, el("figcaption", null, v.titulo), b); g.append(fig);
  });
  return g;
}
let nodoCrudos; // se crea una vez: la subida sigue aunque cambies de pestaña
const crudos = () => nodoCrudos ||= (() => { const d = el("div"); d.style.setProperty("--cr-a", "var(--a)"); Crudos.montar(d, { p: P, quien: () => quien || cfg.tripulacion[0], toast }); return d; })();
function vistaVideos() {
  const f = document.createDocumentFragment(), n = (cfg.videos || []).length;
  f.append(el("h2", null, `Videos · ${n}`));
  if (n) f.append(el("p", "sub", "Toca Publicar: en el cel se abre tu menú Compartir con el video y el texto ya va copiado."), listos());
  else f.append(el("div", "vacio", cfg.videosVacio));
  const form = el("form", "fila"), inp = el("input", "campo"); inp.placeholder = "Pega aquí el enlace de tu clip (Drive, Dropbox, TikTok)…"; inp.setAttribute("aria-label", "Enlace del clip"); inp.maxLength = 500;
  const bt = el("button", "btn a", "Mandar a editar"); bt.type = "submit"; form.append(inp, bt);
  form.onsubmit = async (e) => { e.preventDefault(); const t = inp.value.trim(); if (!t) return; if (await enviar({ tipo: "pedido", texto: "Editar este clip: " + t })) toast("Mandado a la Fábrica"); };
  const ta = el("button", "btn", "🎬 Taller: ver lo que se está renderizando"); ta.type = "button"; ta.onclick = () => Taller.abrir();
  f.append(ta, el("h2", null, "Subir crudos"), el("p", "sub", "Sube tus videos o fotos originales (del tamaño que sea) y di qué quieres. La Fábrica los edita en su siguiente vuelta y aparecen aquí arriba."), crudos(),
    el("h2", null, "…o pega un enlace"), el("p", "sub", "Si ya está en Google Drive, Dropbox o TikTok."), form);
  return f;
}

function abrirAjustes() {
  const a = srv.ajustes || {};
  Ajustes.abrir({
    titulo: "Ajustes · " + cfg.nombre,
    valores: { tripulacion: cfg.tripulacion, redes: cfg.redes, ig: cfg.ig },
    secciones: [
      { t: "Equipo", campos: [{ k: "tripulacion", n: "Quién usa este panel", tipo: "lista", ph: "Nombre", max: 8 }] },
      { t: "Publicación", campos: [{ k: "redes", n: "Redes donde publicas", tipo: "redes" }, { k: "ig", n: "Tu Instagram (sin @)", tipo: "texto", ph: "tu_cuenta" }] },
      { t: "Este dispositivo", campos: [
        { local: true, n: "Soy", tipo: "opciones", opciones: cfg.tripulacion.map((n) => [n, n]), valor: quien || cfg.tripulacion[0], onCambio: (n) => { quien = n; ls.set(`quien-${P}`, n); barraTripu(); } },
        { local: true, n: "Tamaño de letra", tipo: "opciones", opciones: [["chica", "Chica"], ["normal", "Normal"], ["grande", "Grande"], ["enorme", "Enorme"]], valor: Ajustes.letra(), onCambio: (x) => Ajustes.letra(x) } ] },
    ],
    extra: [Ajustes.seccion("App y sesión", [
      el("small", null, "Instálalo como app: en iPhone/iPad, Safari → Compartir → Agregar a inicio. En Android, Chrome → ⋮ → Instalar app."),
      Ajustes.enlace("Ir al lobby", "/"), Ajustes.enlace("Cerrar sesión en este dispositivo", "/__salir", "peligro")])],
    onGuardar: (v) => enviar({ tipo: "ajustes", ajustes: { ...a, tripulacion: v.tripulacion, redes: v.redes, cuentas: { ...(a.cuentas || {}), instagram: v.ig } } }).then((ok) => { if (ok) { barraTripu(); toast("Ajustes guardados"); } return ok; }),
  });
}

function vistaTemas() {
  const f = document.createDocumentFragment(), g = el("div", "temas");
  f.append(el("h2", null, "Tus temas"), el("p", "sub", cfg.temasSub));
  cfg.temas.forEach((t) => {
    const c = el("article", "tema"); if (t.c) c.style.setProperty("--c", t.c);
    const ul = el("ul"); (t.ejemplos || []).forEach((x) => ul.append(el("li", null, x)));
    const b = el("button", "btn mini", "Dame ideas de esto"); b.type = "button"; b.onclick = () => abrirSala(`Dame 3 ideas de "${t.n}" para grabar esta semana, con gancho, tomas y texto.`);
    c.append(el("h3", null, t.n), el("p", null, t.por), ul, b); g.append(c);
  });
  f.append(g); return f;
}

function filaPedido(p) {
  const r = el("div", "ped" + (p.estado === "listo" ? " listo" : "")), t = el("div");
  t.append(document.createTextNode(p.texto), el("small", null, `${p.quien} · ${hace(p.at)}`));
  if (p.nota) { const n = el("div", "nota"); n.innerHTML = "<b>Claude:</b> " + md(p.nota); t.append(n); }
  const sel = el("select"); sel.setAttribute("aria-label", "Estado"); Object.entries(EST).forEach(([k, n]) => sel.append(Object.assign(el("option", null, n), { value: k }))); sel.value = p.estado;
  sel.onchange = () => enviar({ tipo: "pedido-estado", pid: p.id, estado: sel.value });
  const acc = document.createElement("div"); acc.style.cssText = "display:flex;gap:6px;align-items:center";
  const ed = el("button", "btn mini", "✎"), bo = el("button", "btn mini", "🗑"); ed.type = bo.type = "button"; ed.setAttribute("aria-label", "Editar"); bo.setAttribute("aria-label", "Borrar");
  ed.onclick = () => { const n = prompt("Edita el pedido:", p.texto); if (n?.trim() && n.trim() !== p.texto) enviar({ tipo: "pedido-editar", pid: p.id, texto: n.trim() }); };
  bo.onclick = () => confirm("¿Borrar este pedido? No se puede deshacer.") && enviar({ tipo: "pedido-borrar", pid: p.id });
  acc.append(sel, ed, bo); r.append(t, acc); return r;
}

function vistaIdeas() {
  const f = document.createDocumentFragment();
  f.append(el("h2", null, "Ideas y pedidos"), el("p", "sub", "Lo que apuntas aquí o en el chat queda guardado para los dos. Claude lo toma en su siguiente sesión."));
  const form = el("form", "fila"), inp = el("input", "campo"); inp.placeholder = "Apunta una idea o pega un enlace de tu clip…"; inp.maxLength = 500; inp.setAttribute("aria-label", "Nueva idea");
  const b = el("button", "btn a", "Guardar"); b.type = "submit"; form.append(inp, b);
  form.onsubmit = async (e) => { e.preventDefault(); const t = inp.value.trim(); if (!t) return; if (!quien) return toast("Primero toca quién eres (arriba)"); if (await enviar({ tipo: "pedido", texto: t })) toast("Guardada"); };
  f.append(form);
  const l = srv.pedidos || []; if (!l.length) f.append(el("div", "vacio", "Nada todavía."));
  l.slice(0, 60).forEach((p) => f.append(filaPedido(p)));
  return f;
}

// --- chat ---
let chat = ls.get(`chat-${P}`, []);
let hilo = ls.get(`hilo-${P}`, null); // plática actual en el historial de quien entró
const guardaChat = () => { ls.set(`chat-${P}`, chat.slice(-40)); ls.set(`hilo-${P}`, hilo); };
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inl = (t) => t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*(?!\s)([^*]+?)\*/g, "$1<i>$2</i>").replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
function md(t) { // markdown mínimo y seguro: se escapa todo antes de dar formato
  let out = "", lista = false;
  esc(String(t)).split("\n").forEach((l) => {
    const li = /^\s*(?:[-*•]|\d+[.)])\s+(.*)/.exec(l);
    if (li) { if (!lista) { out += "<ul>"; lista = true; } out += "<li>" + inl(li[1]) + "</li>"; return; }
    if (lista) { out += "</ul>"; lista = false; }
    if (/^#{1,4}\s/.test(l)) out += "<h4>" + inl(l.replace(/^#+\s/, "")) + "</h4>"; else if (l.trim()) out += "<p>" + inl(l) + "</p>";
  });
  return out + (lista ? "</ul>" : "");
}
function burbujaBot(txt) { const b = el("div", "bur bot"); b.innerHTML = `<span class="quien">${esc(cfg.chatNombre)}</span>` + md(txt); return b; }
function pintaChat(pensando) {
  const bur = $("#burbujas"); bur.replaceChildren();
  if (!chat.length) bur.append(burbujaBot(cfg.saludo.replace("{quien}", quien ? ", " + quien : "")));
  chat.forEach((m) => bur.append(m.rol === "yo" ? el("div", "bur yo", m.texto) : m.rol === "pedido" ? el("div", "bur pedido", "✓ Apuntado: " + m.texto) : burbujaBot(m.texto)));
  if (pensando) { const p = el("div", "pensando"); p.setAttribute("aria-label", "Pensando"); p.append(el("span"), el("span"), el("span")); bur.append(p); }
  bur.scrollTop = bur.scrollHeight;
  const ch = $("#chips"); ch.replaceChildren(); (chat.length ? cfg.ideas.slice(0, 3) : cfg.ideas).forEach((t) => { const x = el("button", null, t); x.type = "button"; x.onclick = () => mandar(t); ch.append(x); });
}
async function mandar(t) {
  t = t.trim(); if (!t) return;
  if (!quien) { quien = cfg.tripulacion[0]; ls.set(`quien-${P}`, quien); barraTripu(); }
  chat.push({ rol: "yo", texto: t }); guardaChat(); pintaChat(true);
  $("#enviar").disabled = true;
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ proyecto: P, mensajes: chat, quien, hilo }) });
    if (r.status === 401) return location.reload();
    const d = await r.json();
    chat.push({ rol: "bot", texto: d.respuesta || "Se me fue la señal. ¿Me lo repites?" });
    if (d.pedido) { chat.push({ rol: "pedido", texto: d.pedido }); await traer(); }
    if (d.hilo) hilo = d.hilo;
  } catch { chat.push({ rol: "bot", texto: "No pude conectarme. Revisa la señal e intenta de nuevo." }); }
  $("#enviar").disabled = false; guardaChat(); pintaChat(false);
}
function abrirSala(pregunta) {
  $("#sala").hidden = false; document.body.style.overflow = "hidden"; pintaChat(false); if (typeof pregunta === "string") mandar(pregunta); else setTimeout(() => $("#entrada").focus(), 50);
  if (hilo && typeof pregunta !== "string") Historial.cargar(P, hilo).then((h) => { if (h.mensajes.length >= chat.length) { chat = h.mensajes; guardaChat(); pintaChat(false); } }).catch(() => {}); // la misma plática en otro dispositivo
}
function cerrarSala() { $("#sala").hidden = true; document.body.style.overflow = ""; render(); }
$("#fab").onclick = () => abrirSala(); $("#salaCerrar").onclick = cerrarSala;
$("#salaNueva").onclick = () => { chat = []; hilo = null; guardaChat(); pintaChat(false); };
$("#salaHist").onclick = () => Historial.abrir({ p: P, actual: hilo, onAbrir: (h) => { chat = h.mensajes; hilo = h.id; guardaChat(); pintaChat(false); }, onNueva: () => $("#salaNueva").click(), onBorrada: () => $("#salaNueva").click() });
const entrada = $("#entrada");
entrada.addEventListener("input", () => { entrada.style.height = "auto"; entrada.style.height = Math.min(160, entrada.scrollHeight) + "px"; });
entrada.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); $("#compositor").requestSubmit(); } });
$("#compositor").onsubmit = (e) => { e.preventDefault(); const t = entrada.value; entrada.value = ""; entrada.style.height = "auto"; mandar(t); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sala").hidden) cerrarSala(); });

function render() {
  if (!$("#sala").hidden) return;
  const act = document.activeElement; if (act && act.classList.contains("campo")) return; // no pisar lo que se escribe
  const y = scrollY; $("#vista").replaceChildren((VISTAS[tab] || vistaInicio)()); scrollTo({ top: y });
}
const VISTAS = { inicio: vistaInicio, videos: vistaVideos, temas: vistaTemas, ideas: vistaIdeas };
function irTab(t) {
  tab = VISTAS[t] ? t : "inicio"; history.replaceState(null, "", "#" + tab);
  document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.t === tab)));
  if (!$("#sala").hidden) cerrarSala(); render(); scrollTo({ top: 0 });
}
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => irTab(b.dataset.t)));
addEventListener("hashchange", () => location.hash.slice(1) !== tab && irTab(location.hash.slice(1)));
tab = VISTAS[location.hash.slice(1)] ? location.hash.slice(1) : "inicio";
document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.t === tab)));

(async () => {
  try { cfg = await (await fetch(`/proyectos/${P}.json`, { cache: "no-store" })).json(); }
  catch { $("#vista").replaceChildren(el("div", "vacio", "No encontré este panel. Regresa a Paneles.")); return; }
  document.title = cfg.nombre + " · Panel";
  for (const [k, v] of Object.entries(cfg.colores || {})) document.documentElement.style.setProperty(k, v);
  $("#titulo").innerHTML = cfg.titulo; $("#lema").textContent = cfg.lema;
  $("#salaNombre").textContent = cfg.chatNombre; $("#salaSub").textContent = cfg.chatSub; $("#fabTxt").textContent = cfg.fab || "Platicar";
  cfg._base = { tripulacion: cfg.tripulacion, redes: cfg.redes || ["tiktok", "instagram", "youtube"] }; $("#engrane").onclick = abrirAjustes;
  await traer(); quien = ls.get(`quien-${P}`, cfg.tripulacion[0]);
  const yo = await fetch("/api/yo").then((r) => r.json()).catch(() => ({})); // quien entró con su PIN
  if (yo.nombre) { quien = yo.nombre; ls.set(`quien-${P}`, quien); }
  barraTripu(); render();
  setInterval(async () => { if (document.visibilityState !== "visible") return; const antes = JSON.stringify(srv); await traer(); if (JSON.stringify(srv) !== antes) render(); }, 15000);
})();
</script>
